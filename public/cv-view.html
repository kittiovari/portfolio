<html lang="hu">
<head>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #404040; overflow: hidden; }

      display: block;
      width: 100%;

      opacity: 0;
      transition: opacity 0.25s ease;
    }
    iframe.visible { opacity: 1; }
  </style>
</head>
<body>
  <iframe id="pdf" src="/CV%20-%20H.%20%C3%93v%C3%A1ri%20Kitti%20%282026%2C%20HU%29.pdf#view=FitV&amp;navpanes=0&amp;pagemode=none&amp;toolbar=1"></iframe>
  <script>
    setTimeout(function() {
      document.getElementById('pdf').classList.add('visible');
    }, 450);
  </script>
</body>
</html>
